name: preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/**'
      - '.github/workflows/preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
        with:
          path: meta

      - name: Runner resources
        run: |
          df -h /
          nproc
          free -g
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Repo init with local manifest
        run: |
          git config --global user.name "Axion Preflight"
          git config --global user.email "preflight@axion.local"
          mkdir workspace
          cd workspace
          repo init -u https://github.com/AxionAOSP/android.git -b lineage-23.2 \
            --git-lfs --depth=1 --no-clone-bundle
          mkdir -p .repo/local_manifests
          cp ../meta/ci/local_manifest.xml .repo/local_manifests/rmx1971.xml
          repo manifest -o "$RUNNER_TEMP/merged.xml"
          grep -c '<project ' "$RUNNER_TEMP/merged.xml"

      - name: Sync fork and build projects
        run: |
          cd workspace
          repo sync -c -j4 --no-clone-bundle --no-tags --force-sync \
            device/realme/RMX1971 \
            packages/apps/Settings \
            packages/apps/FaceUnlock \
            frameworks/base \
            vendor/realme/RMX1971 \
            system/sepolicy \
            device/qcom/sepolicy_vndr/legacy-um \
            device/lineage/sepolicy \
            device/axion/common \
            vendor/official_devices \
            vendor/lineage \
            hardware/qcom-caf/common \
            build/make \
            build/soong \
            build/blueprint \
            build/release \
            prebuilts/build-tools \
            prebuilts/go/linux-x86 \
            external/go-cmp \
            external/golang-protobuf \
            external/starlark-go \
            external/pogreb \
            prebuilts/bazel/common \
            development
          python3 device/realme/RMX1971/ci/patch_envsetup.py build/make/envsetup.sh
          df -h /

      - name: Preflight checks
        run: bash meta/ci/preflight.sh "$PWD/workspace" "$RUNNER_TEMP/merged.xml" "$PWD/meta"

      - name: Product config (lunch)
        run: |
          cd workspace
          export ANDROID_KEY_PATH="$PWD/vendor/lineage-priv/keys"
          mkdir -p "$ANDROID_KEY_PATH"
          export LC_ALL=C
          timeout --signal=KILL 3300 bash ../meta/ci/lunch_probe.sh </dev/null
